name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      # 1. ให้มันสำรวจโฟลเดอร์ทั้งหมดก่อนว่าไฟล์โปรเจกต์อยู่ที่ไหน
      - name: Find Project Root
        run: |
          echo "สำรวจไฟล์ในโปรเจกต์:"
          find . -maxdepth 3 -name "build.gradle"
          echo "--------------------------------"
          ls -R

      - name: Grant Permissions for Gradle
        run: chmod +x gradlew

      # 2. Build โดยใช้พารามิเตอร์เพื่อให้เห็น Log ชัดขึ้น
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      # 3. ค้นหาไฟล์ APK จริงๆ ว่าอยู่ที่ไหน
      - name: Locate APK
        run: find . -name "*.apk"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: "Auto-generated build."
          files: |
            **/app-debug.apk
