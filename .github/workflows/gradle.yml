name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Grant Permissions for Gradle
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      # --- ส่วนนี้คือส่วนตรวจสอบตำแหน่งไฟล์ ---
      - name: Debug - Find APK file
        run: |
          echo "กำลังหาไฟล์ APK ในโปรเจกต์..."
          find . -name "*.apk"
          echo "โครงสร้างโฟลเดอร์ปัจจุบัน:"
          ls -R app/build/outputs/apk/
      # -----------------------------------

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: "Auto-generated build."
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/*.apk
